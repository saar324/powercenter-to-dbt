[project]
name = "powercenter-to-dbt"
version = "0.0.0"
description = "PowerCenter XML-to-dbt take-home exercise; implementation pending."
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
integration = [
    "dbt-duckdb>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".agents", "_bmad", "_bmad-output", "fixtures", "work"]
