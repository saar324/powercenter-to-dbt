name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"
      - run: uv sync --locked
      - run: uv run pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measured-test-runs
          path: reports/
