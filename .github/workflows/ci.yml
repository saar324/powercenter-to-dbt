name: Repository setup

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.13.4"
          enable-cache: true
      - name: Install pinned BMAD tooling
        run: |
          npm ci --ignore-scripts --no-fund
      - name: Check BMAD configuration and supplied files
        run: |
          uv run --python 3.13 _bmad/scripts/resolve_config.py --project-root "$PWD"
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import assert from 'node:assert/strict';
          const provenance = JSON.parse(readFileSync('fixtures/powercenter/provenance.json', 'utf8'));
          for (const item of provenance.files) {
            assert.equal(createHash('sha256').update(readFileSync(item.path)).digest('hex'), item.sha256);
          }
          console.log('BMAD configuration and original file integrity verified.');
          JS
